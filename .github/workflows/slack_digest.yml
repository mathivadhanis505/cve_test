name: Daily Slack Digest

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  slack-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Execute Slack digest on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/devops-project

            source venv/bin/activate

            export DATABASE_URL="${{ secrets.POSTGRES_URL }}"
            export SLACK_WEBHOOK="${{ secrets.SLACK_WEBHOOK }}"

            python -m notify.slack_digest
